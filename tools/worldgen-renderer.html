// --- Deterministic RNG (matches C# SeededRng: xorshift64*) ---
class SeededRng {
  constructor(seed) {
    const bytes = new Uint8Array(32);
    const enc = new TextEncoder().encode(seed);
    // SHA-256 polyfill via simple hash (deterministic, not crypto-grade)
    let h = 0x9E3779B9n;
    for (let i = 0; i < enc.length; i++) {
      h = ((h ^ BigInt(enc[i])) * 2654435761n) & 0xFFFFFFFFFFFFFFFFn;
    }
    // Pad to get 8 bytes
    this.state = h === 0n ? 0x9E3779B97F4A7C15n : h;
  }
  nextU64() {
    this.state ^= this.state >> 12n;
    this.state ^= (this.state << 25n) & 0xFFFFFFFFFFFFFFFFn;
    this.state ^= this.state >> 27n;
    return (this.state * 2685821657736338717n) & 0xFFFFFFFFFFFFFFFFn;
  }
  next(min, max) {
    const span = max - min;
    if (span <= 0) return min;
    return min + Number(this.nextU64() % BigInt(span));
  }
}

// --- World Generator (matches C# DeterministicWorldGenerator) ---
const ARCHETYPES = ['CodingRoom', 'ReviewRoom', 'Library', 'Lounge'];

function generateWorld(seed, opts) {
  const rng = new SeededRng(seed + '|' + opts.style);
  const rooms = [];
  let id = 1;
  for (const arch of ARCHETYPES) {
    let placed = null, tries = 0;
    // Try smaller rooms if large ones don't fit
    for (let sizeAttempt = 0; sizeAttempt < 3 && !placed; sizeAttempt++) {
      const wMax = Math.max(6, 14 - sizeAttempt * 2);
      const hMax = Math.max(5, 11 - sizeAttempt * 2);
      const w = rng.next(6, wMax);
      const h = rng.next(5, hMax);
      for (let t = 0; t < 500; t++) {
        const x = rng.next(1, opts.width - w - 1);
        const y = rng.next(1, opts.height - h - 1);
        const candidate = { id: `room-${id}`, archetype: arch, x, y, w, h, cx: x + Math.floor(w/2), cy: y + Math.floor(h/2) };
        if (!rooms.some(r => overlap(r, candidate))) {
          placed = candidate;
          break;
        }
      }
    }
    if (placed) { rooms.push(placed); id++; }
  }
  // Add bonus rooms (only if they fit cleanly)
  const bonusCount = rng.next(1, 3);
  for (let i = 0; i < bonusCount; i++) {
    const arch = ARCHETYPES[rng.next(0, ARCHETYPES.length)];
    const w = rng.next(5, 8);
    const h = rng.next(4, 7);
    let placed = null;
    for (let t = 0; t < 300; t++) {
      const x = rng.next(1, opts.width - w - 1);
      const y = rng.next(1, opts.height - h - 1);
      const candidate = { id: `room-${id}`, archetype: arch, x, y, w, h, cx: x + Math.floor(w/2), cy: y + Math.floor(h/2) };
      if (!rooms.some(r => overlap(r, candidate))) {
        placed = candidate;
        break;
      }
    }
    if (placed) { rooms.push(placed); id++; }
  }

  const walkable = Array.from({length: opts.width}, () => Array(opts.height).fill(false));
  for (const r of rooms) {
    for (let x = r.x; x < r.x + r.w; x++)
      for (let y = r.y; y < r.y + r.h; y++)
        if (x >= 0 && y >= 0 && x < opts.width && y < opts.height) walkable[x][y] = true;
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i-1], b = rooms[i];
    carveH(a.cx, b.cx, a.cy, walkable, opts);
    carveV(a.cy, b.cy, b.cx, walkable, opts);
  }

  // Place objects with archetype-specific signature layouts
  const objects = [];
  for (const r of rooms) {
    // Signature props per archetype (placed in predictable positions)
    if (r.archetype === 'CodingRoom') {
      // Desk bank with monitors — signature: rows of workstations
      const deskRows = Math.min(3, Math.floor((r.h - 3) / 2));
      for (let row = 0; row < deskRows; row++) {
        const dy = r.y + 2 + row * 2;
        objects.push({ x: r.x + 2, y: dy, type: 'desk', room: r.id });
        objects.push({ x: r.x + 3, y: dy, type: 'monitor', room: r.id });
        if (r.w > 7) {
          objects.push({ x: r.x + r.w - 4, y: dy, type: 'desk', room: r.id });
          objects.push({ x: r.x + r.w - 3, y: dy, type: 'monitor', room: r.id });
        }
        objects.push({ x: r.x + 4, y: dy, type: 'chair', room: r.id });
      }
      // Corner plant
      objects.push({ x: r.x + r.w - 2, y: r.y + r.h - 2, type: 'plant', room: r.id });
    } else if (r.archetype === 'ReviewRoom') {
      // Whiteboard focal + seating arc
      objects.push({ x: r.x + Math.floor(r.w / 2), y: r.y + 1, type: 'whiteboard', room: r.id });
      objects.push({ x: r.x + Math.floor(r.w / 2) - 1, y: r.y + 1, type: 'whiteboard', room: r.id });
      // Chairs facing board
      for (let i = 0; i < Math.min(4, r.w - 4); i++) {
        objects.push({ x: r.x + 2 + i, y: r.y + 3, type: 'chair', room: r.id });
      }
      objects.push({ x: r.x + 1, y: r.y + r.h - 2, type: 'plant', room: r.id });
    } else if (r.archetype === 'Library') {
      // Shelves along walls
      for (let i = 0; i < Math.min(3, Math.floor(r.h / 3)); i++) {
        objects.push({ x: r.x + 1, y: r.y + 1 + i * 3, type: 'bookshelf', room: r.id });
        if (r.w > 6) objects.push({ x: r.x + r.w - 2, y: r.y + 1 + i * 3, type: 'bookshelf', room: r.id });
      }
      // Reading nook
      objects.push({ x: r.x + Math.floor(r.w / 2), y: r.y + Math.floor(r.h / 2), type: 'chair', room: r.id });
      objects.push({ x: r.x + Math.floor(r.w / 2) + 1, y: r.y + Math.floor(r.h / 2), type: 'lamp', room: r.id });
      objects.push({ x: r.x + r.w - 2, y: r.y + r.h - 2, type: 'plant', room: r.id });
    } else {
      // Lounge — couch cluster + coffee table + plants
      objects.push({ x: r.x + 2, y: r.y + 2, type: 'couch', room: r.id });
      if (r.w > 6) objects.push({ x: r.x + 4, y: r.y + 2, type: 'couch', room: r.id });
      objects.push({ x: r.x + 3, y: r.y + 4, type: 'coffee-table', room: r.id });
      objects.push({ x: r.x + 1, y: r.y + 1, type: 'plant', room: r.id });
      objects.push({ x: r.x + r.w - 2, y: r.y + 1, type: 'plant', room: r.id });
      objects.push({ x: r.x + r.w - 2, y: r.y + r.h - 2, type: 'lamp', room: r.id });
    }
  }

  // Place agents in rooms
  const agentDefs = [
    { id: 'claude', name: 'Claude', color: '#f97316', emoji: '🤖', role: 'Developer' },
    { id: 'copilot', name: 'Copilot', color: '#3b82f6', emoji: '🧑‍💻', role: 'Developer' },
    { id: 'jdai', name: 'JD.AI', color: '#22c55e', emoji: '🤖', role: 'Assistant' },
    { id: 'ralph', name: 'Ralph', color: '#a855f7', emoji: '👔', role: 'Triage' },
  ];
  const agents = [];
  for (let i = 0; i < Math.min(agentDefs.length, rooms.length); i++) {
    const r = rooms[i];
    const ax = rng.next(r.x + 2, r.x + r.w - 2);
    const ay = rng.next(r.y + 2, r.y + r.h - 2);
    agents.push({ ...agentDefs[i], x: ax, y: ay, room: r.id, status: i < 2 ? 'active' : (i < 3 ? 'idle' : 'offline') });
  }

  return { rooms, walkable, objects, agents, seed, opts };
}

function overlap(a, b) {
  // Add 3-tile padding between rooms (zero-tolerance overlap policy)
  const pad = 3;
  return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
}
function carveH(x1, x2, y, w, opts) {
  const cw = opts.corridorWidth || 2;
  for (let x = Math.min(x1,x2); x <= Math.max(x1,x2); x++)
    for (let dy = 0; dy < cw; dy++)
      if (x >= 0 && x < opts.width && y+dy >= 0 && y+dy < opts.height) w[x][y+dy] = true;
}
function carveV(y1, y2, x, w, opts) {
  const cw = opts.corridorWidth || 2;
  for (let y = Math.min(y1,y2); y <= Math.max(y1,y2); y++)
    for (let dx = 0; dx < cw; dx++)
      if (x+dx >= 0 && x+dx < opts.width && y >= 0 && y < opts.height) w[x+dx][y] = true;
}

function drawPixelSprite(ctx, name, px, py, style, scale = 2, overrideColor = null) {
  const sprite = PIXEL_SPRITES[name] || PIXEL_SPRITES['desk'];
  const pal = SPRITE_PALS[style] || SPRITE_PALS['retro-office'];
  for (let row = 0; row < sprite.length; row++) {
    for (let col = 0; col < sprite[row].length; col++) {
      const ch = sprite[row][col];
      if (ch === '.') continue;
      ctx.fillStyle = overrideColor || pal[parseInt(ch, 16)];
      ctx.fillRect(px + col * scale, py + row * scale, scale, scale);
    }
  }
}

// --- Renderer ---
function render(canvas, world) {
  const pal = PALETTES[world.opts.style] || PALETTES['retro-office'];
  const tileSize = 32;
  const W = world.opts.width, H = world.opts.height;
  const pad = 32; // top padding for title
  const legendW = 180; // sidebar width
  canvas.width = W * tileSize + legendW;
  canvas.height = H * tileSize + pad;
  const ctx = canvas.getContext('2d');
  const oY = pad; // offset for content

  // Background
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle grid dots
  ctx.fillStyle = pal.grid + '40';
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      ctx.fillRect(x*tileSize, y*tileSize + oY, 1, 1);
    }
  }

  // Corridors with edge definition
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      if (world.walkable[x][y]) {
        const inRoom = world.rooms.some(r => x >= r.x && x < r.x+r.w && y >= r.y && y < r.y+r.h);
        if (!inRoom) {
          // Corridor floor
          ctx.fillStyle = pal.corridor;
          ctx.fillRect(x*tileSize, y*tileSize + oY, tileSize, tileSize);
          // Lighter center strip
          ctx.fillStyle = pal.accent + '0a';
          ctx.fillRect(x*tileSize + 4, y*tileSize + oY + 4, tileSize - 8, tileSize - 8);
          // Dark edge where corridor meets void
          const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
          for (const [dx,dy] of dirs) {
            const nx = x+dx, ny = y+dy;
            if (nx < 0 || ny < 0 || nx >= W || ny >= H || !world.walkable[nx][ny]) {
              ctx.fillStyle = '#00000040';
              if (dx === -1) ctx.fillRect(x*tileSize, y*tileSize + oY, 2, tileSize);
              if (dx === 1) ctx.fillRect(x*tileSize + tileSize - 2, y*tileSize + oY, 2, tileSize);
              if (dy === -1) ctx.fillRect(x*tileSize, y*tileSize + oY, tileSize, 2);
              if (dy === 1) ctx.fillRect(x*tileSize, y*tileSize + oY + tileSize - 2, tileSize, 2);
            }
          }
        }
      }
    }
  }

  // Room shadows (drawn first, behind rooms)
  for (const r of world.rooms) {
    ctx.fillStyle = '#00000040';
    ctx.fillRect(r.x*tileSize + 4, r.y*tileSize + oY + 4, r.w*tileSize, r.h*tileSize);
  }

  // Rooms
  for (const r of world.rooms) {
    const rc = pal.rooms[r.archetype] || pal.floor;
    const rx = r.x*tileSize, ry = r.y*tileSize + oY, rw = r.w*tileSize, rh = r.h*tileSize;

    // Floor fill with gradient
    const grad = ctx.createLinearGradient(rx, ry, rx + rw, ry + rh);
    grad.addColorStop(0, rc);
    grad.addColorStop(1, rc + 'cc');
    ctx.fillStyle = grad;
    ctx.fillRect(rx, ry, rw, rh);

    // Floor texture (very subtle, reduced noise per QA)
    ctx.fillStyle = '#ffffff03';
    for (let tx = r.x; tx < r.x + r.w; tx++) {
      for (let ty = r.y; ty < r.y + r.h; ty++) {
        if ((tx + ty) % 4 === 0) ctx.fillRect(tx*tileSize + 4, ty*tileSize + oY + 4, tileSize - 8, tileSize - 8);
      }
    }

    // Strong wall border (clear room boundary)
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.strokeRect(rx + 1, ry + 1, rw - 2, rh - 2);
    ctx.strokeStyle = pal.wall;
    ctx.lineWidth = 2;
    ctx.strokeRect(rx + 3, ry + 3, rw - 6, rh - 6);
    // Inner highlight
    ctx.strokeStyle = pal.accent + '20';
    ctx.lineWidth = 1;
    ctx.strokeRect(rx + 5, ry + 5, rw - 10, rh - 10);

    // Corner accents
    const cs = 4;
    ctx.fillStyle = pal.accent + '60';
    ctx.fillRect(rx + 1, ry + 1, cs, cs);
    ctx.fillRect(rx + rw - cs - 1, ry + 1, cs, cs);
    ctx.fillRect(rx + 1, ry + rh - cs - 1, cs, cs);
    ctx.fillRect(rx + rw - cs - 1, ry + rh - cs - 1, cs, cs);

    // Room label with background pill
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    const labelText = r.archetype.replace(/Room$/, ' Room');
    const tm = ctx.measureText(labelText);
    const lx = r.cx * tileSize, ly = (r.y + 0.8) * tileSize + oY;
    ctx.fillStyle = '#00000070';
    ctx.beginPath();
    ctx.roundRect(lx - tm.width/2 - 6, ly - 10, tm.width + 12, 20, 4);
    ctx.fill();
    ctx.fillStyle = pal.label;
    ctx.fillText(labelText, lx, ly);

    // Room ID badge
    ctx.fillStyle = pal.label + '50';
    ctx.font = '8px monospace';
    ctx.fillText(r.id, r.cx*tileSize, (r.y + r.h - 0.3)*tileSize + oY);
  }

  // Door markers (where corridors meet room edges)
  ctx.fillStyle = pal.accent + '80';
  for (const r of world.rooms) {
    for (let x = r.x; x < r.x + r.w; x++) {
      // Top edge
      if (r.y > 0 && world.walkable[x]?.[r.y - 1]) {
        ctx.fillRect(x*tileSize + 2, r.y*tileSize + oY - 2, tileSize - 4, 4);
      }
      // Bottom edge
      if (r.y + r.h < H && world.walkable[x]?.[r.y + r.h]) {
        ctx.fillRect(x*tileSize + 2, (r.y + r.h)*tileSize + oY - 2, tileSize - 4, 4);
      }
    }
    for (let y = r.y; y < r.y + r.h; y++) {
      // Left edge
      if (r.x > 0 && world.walkable[r.x - 1]?.[y]) {
        ctx.fillRect(r.x*tileSize - 2, y*tileSize + oY + 2, 4, tileSize - 4);
      }
      // Right edge
      if (r.x + r.w < W && world.walkable[r.x + r.w]?.[y]) {
        ctx.fillRect((r.x + r.w)*tileSize - 2, y*tileSize + oY + 2, 4, tileSize - 4);
      }
    }
  }

  // Objects as pixel sprites (native 32x32)
  for (const obj of world.objects) {
    const ox = obj.x * tileSize;
    const oy = obj.y * tileSize + oY;
    const sprName = obj.type === 'table' ? 'desk' : obj.type;
    // Try native 32x32 sprite first, fall back to 16x16 scaled
    if (typeof SPRITES_32_DATA !== 'undefined' && SPRITES_32_DATA[sprName]) {
      const spr = SPRITES_32_DATA[sprName];
      const spPal = SPRITE_PALS_32[world.opts.style] || SPRITE_PALS_32['retro-office'];
      for (let row = 0; row < spr.length; row++) {
        for (let col = 0; col < spr[row].length; col++) {
          const ch = spr[row][col];
          if (ch === '.') continue;
          ctx.fillStyle = spPal[parseInt(ch, 16)];
          ctx.fillRect(ox + col, oy + row, 1, 1);
        }
      }
    } else if (PIXEL_SPRITES[sprName]) {
      ctx.globalAlpha = 0.4;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        drawPixelSprite(ctx, sprName, ox + dx, oy + dy, world.opts.style, 2, '#111');
      }
      ctx.globalAlpha = 1.0;
      drawPixelSprite(ctx, sprName, ox, oy, world.opts.style, 2);
    } else {
      ctx.fillStyle = pal.obj;
      ctx.fillRect(ox + 6, oy + 6, 20, 20);
    }
  }

  // Agents as pixel art humanoid sprites
  for (const agent of (world.agents || [])) {
    const ax = agent.x * tileSize;
    const ay = agent.y * tileSize + oY;
    const sc = agent.status === 'active' ? '#22c55e' : agent.status === 'idle' ? '#eab308' : '#666';
    const c = agent.color;

    // Shadow
    ctx.fillStyle = '#00000030';
    ctx.beginPath();
    ctx.ellipse(ax + 16, ay + 30, 12, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 1px dark outline (draw body offset in 4 dirs)
    ctx.fillStyle = '#000';
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      // Head outline
      ctx.fillRect(ax + 11 + dx, ay + 2 + dy, 10, 10);
      // Shirt outline
      ctx.fillRect(ax + 10 + dx, ay + 12 + dy, 12, 10);
      ctx.fillRect(ax + 7 + dx, ay + 13 + dy, 4, 8);
      ctx.fillRect(ax + 21 + dx, ay + 13 + dy, 4, 8);
    }

    // Body (simplified humanoid)
    // Head
    ctx.fillStyle = '#ffd5a0';
    ctx.fillRect(ax + 11, ay + 2, 10, 10);
    // Hair
    ctx.fillStyle = c;
    ctx.fillRect(ax + 10, ay + 1, 12, 4);
    ctx.fillRect(ax + 10, ay + 1, 3, 8);
    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(ax + 13, ay + 6, 2, 2);
    ctx.fillRect(ax + 18, ay + 6, 2, 2);
    // Mouth
    ctx.fillStyle = '#c08060';
    ctx.fillRect(ax + 14, ay + 9, 4, 1);
    // Shirt
    ctx.fillStyle = c;
    ctx.fillRect(ax + 10, ay + 12, 12, 10);
    ctx.fillRect(ax + 7, ay + 13, 4, 8); // left arm
    ctx.fillRect(ax + 21, ay + 13, 4, 8); // right arm
    // Hands
    ctx.fillStyle = '#ffd5a0';
    ctx.fillRect(ax + 8, ay + 21, 3, 3);
    ctx.fillRect(ax + 21, ay + 21, 3, 3);
    // Pants
    ctx.fillStyle = '#334';
    ctx.fillRect(ax + 11, ay + 22, 5, 6);
    ctx.fillRect(ax + 17, ay + 22, 5, 6);
    // Shoes
    ctx.fillStyle = '#222';
    ctx.fillRect(ax + 10, ay + 28, 6, 2);
    ctx.fillRect(ax + 17, ay + 28, 6, 2);

    // Status indicator
    ctx.beginPath();
    ctx.arc(ax + 24, ay + 3, 4, 0, Math.PI * 2);
    ctx.fillStyle = sc;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Name label
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const nameText = agent.name;
    const nm = ctx.measureText(nameText);
    ctx.fillStyle = '#000000bb';
    ctx.beginPath();
    ctx.roundRect(ax + 16 - nm.width / 2 - 4, ay - 14, nm.width + 8, 14, 3);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(nameText, ax + 16, ay - 13);
  }

  // Title bar
  const titleGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  titleGrad.addColorStop(0, pal.bg);
  titleGrad.addColorStop(0.5, pal.accent + '30');
  titleGrad.addColorStop(1, pal.bg);
  ctx.fillStyle = titleGrad;
  ctx.fillRect(0, 0, canvas.width, pad);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 11px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`AgentHabitat`, 8, pad/2);
  ctx.fillStyle = '#ffffff90';
  ctx.font = '10px system-ui';
  ctx.fillText(`seed: ${world.seed}  |  ${world.opts.style}  |  ${world.rooms.length} rooms  |  ${world.objects.length} objects`, 110, pad/2);

  // --- Legend Panel ---
  const lx = W * tileSize; // legend x start
  ctx.fillStyle = pal.bg;
  ctx.fillRect(lx, 0, legendW, canvas.height);
  ctx.strokeStyle = pal.wall;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, canvas.height); ctx.stroke();

  let ly = pad + 12;
  ctx.fillStyle = pal.label;
  ctx.font = 'bold 11px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('Agents', lx + 10, ly);
  ly += 18;

  for (const agent of (world.agents || [])) {
    // Agent dot
    ctx.beginPath();
    ctx.arc(lx + 18, ly + 6, 5, 0, Math.PI * 2);
    ctx.fillStyle = agent.color;
    ctx.fill();
    // Status dot
    const sc = agent.status === 'active' ? '#22c55e' : agent.status === 'idle' ? '#eab308' : '#666';
    ctx.beginPath();
    ctx.arc(lx + 24, ly + 2, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = sc;
    ctx.fill();
    // Name + role
    ctx.fillStyle = pal.label;
    ctx.font = 'bold 9px system-ui';
    ctx.fillText(agent.name, lx + 32, ly);
    ctx.fillStyle = pal.label + '80';
    ctx.font = '8px system-ui';
    ctx.fillText(agent.role + ' · ' + agent.status, lx + 32, ly + 11);
    ly += 28;
  }

  ly += 8;
  ctx.fillStyle = pal.label;
  ctx.font = 'bold 11px system-ui';
  ctx.fillText('Rooms', lx + 10, ly);
  ly += 18;

  for (const r of world.rooms) {
    const rc = pal.rooms[r.archetype] || pal.floor;
    ctx.fillStyle = rc;
    ctx.fillRect(lx + 12, ly + 1, 10, 10);
    ctx.strokeStyle = pal.wall;
    ctx.lineWidth = 1;
    ctx.strokeRect(lx + 12, ly + 1, 10, 10);
    ctx.fillStyle = pal.label + 'cc';
    ctx.font = '8px system-ui';
    ctx.fillText(r.archetype, lx + 28, ly + 2);
    ctx.fillStyle = pal.label + '60';
    ctx.font = '7px monospace';
    ctx.fillText(r.id, lx + 28, ly + 11);
    ly += 22;
  }

  ly += 8;
  ctx.fillStyle = pal.label;
  ctx.font = 'bold 11px system-ui';
  ctx.fillText('Stats', lx + 10, ly);
  ly += 16;
  ctx.fillStyle = pal.label + 'aa';
  ctx.font = '9px system-ui';
  ctx.fillText(`Rooms: ${world.rooms.length}`, lx + 12, ly); ly += 14;
  ctx.fillText(`Objects: ${world.objects.length}`, lx + 12, ly); ly += 14;
  ctx.fillText(`Agents: ${(world.agents||[]).length}`, lx + 12, ly); ly += 14;
  ctx.fillText(`Grid: ${W}×${H}`, lx + 12, ly);
}

// --- UI ---
const canvases = [];

function generate() {
  const seeds = document.getElementById('seeds').value.split(',').map(s => s.trim()).filter(Boolean);
  const styles = [document.getElementById('style1').value, document.getElementById('style2').value];
  const width = parseInt(document.getElementById('width').value) || 64;
  const height = parseInt(document.getElementById('height').value) || 48;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  canvases.length = 0;

  for (const seed of seeds) {
    for (const style of styles) {
      const div = document.createElement('div');
      const canvas = document.createElement('canvas');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const world = generateWorld(seed, { width, height, style });
      render(canvas, world);
      meta.textContent = `${seed} / ${style} — ${world.rooms.length} rooms, ${world.objects.length} objects`;
      div.appendChild(canvas);
      div.appendChild(meta);
      grid.appendChild(div);
      canvases.push({ canvas, seed, style });
    }
  }
}

function downloadAll() {
  for (const { canvas, seed, style } of canvases) {
    const link = document.createElement('a');
    link.download = `worldgen-${seed}-${style}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
}

// Auto-generate on load
generate();
</script>
</body>
</html>
